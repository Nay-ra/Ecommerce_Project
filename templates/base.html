<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}AURA Store{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f8f9fa; }
        .navbar { background: #333; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-radius: 6px; }
        .navbar a { color: white; margin-left: 15px; text-decoration: none; font-weight: bold; }
        .container { max-width: 1100px; margin: 0 auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .card { background: white; border: 1px solid #ddd; padding: 15px; border-radius: 8px; }
        .price { color: #28a745; font-weight: bold; font-size: 1.2em; margin: 10px 0; }
        .btn { display: inline-block; background: #007bff; color: white; padding: 8px 12px; text-decoration: none; border-radius: 4px; border: none; cursor: pointer; }
        .ai-card { background: #eef9ff; border: 1px solid #b6e0fe; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .badge { background: #007bff; color: white; padding: 3px 8px; border-radius: 4px; font-size: 0.8em; }
    </style>
</head>
<body>
    <div class="container">
        <div class="navbar">
            <h2><a href="{% url 'Product_Management:product_list' %}" style="margin-left:0; font-size:1.4rem;">AURA Store</a></h2>
            <div>
                <a href="{% url 'Product_Management:product_list' %}">Catalog</a>
                <a href="{% url 'Shopping_Cart:cart_detail' %}">Cart</a>
                {% if user.is_authenticated %}
                    <span>Welcome, {{ user.username }}!</span>
                    <a href="{% url 'User_Authentication:logout' %}">Logout</a>
                {% else %}
                    <a href="{% url 'User_Authentication:login' %}">Login</a>
                    <a href="{% url 'User_Authentication:register' %}">Register</a>
                {% endif %}
            </div>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="card" style="background: #d4edda; color: #155724; margin-bottom: 15px;">{{ message }}</div>
            {% endfor %}
        {% endif %}

        {% block content %}{% endblock %}
    </div>
</body>
</html>
