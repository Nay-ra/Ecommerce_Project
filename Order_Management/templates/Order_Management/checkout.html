{% extends 'base.html' %}

{% block content %}
<h2>Checkout</h2>
<div class="card" style="max-width: 500px;">
    <form method="POST" action="{% url 'Order_Management:checkout' %}">
        {% csrf_token %}
        <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px; font-weight: bold;">Shipping Address</label>
            <textarea name="shipping_address" required style="width: 100%; height: 80px; padding: 8px; border: 1px solid #ccc; border-radius: 4px;"></textarea>
        </div>
        <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px; font-weight: bold;">Payment Method</label>
            <select name="payment_method" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
                <option value="CREDIT_CARD">Credit Card (Simulated)</option>
                <option value="CASH_ON_DELIVERY">Cash on Delivery</option>
            </select>
        </div>
        <button type="submit" class="btn" style="width: 100%; padding: 10px;">Place Order</button>
    </form>
</div>
{% endblock %}
