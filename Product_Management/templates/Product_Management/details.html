{% extends 'base.html' %}

{% block title %}{{ product.name }} - AURA Store{% endblock %}

{% block content %}
<div class="card" style="max-width: 800px; margin: 20px auto; padding: 20px;">
    {% if product.image %}
        <img src="{{ product.image.url }}" alt="{{ product.name }}" style="max-width: 100%; height: auto; border-radius: 8px;">
    {% endif %}
    <h2>{{ product.name }}</h2>
    <p style="font-size: 1.2rem; color: #28a745; font-weight: bold;">${{ product.price }}</p>
    <p>{{ product.description }}</p>
    
    <form action="{% url 'Shopping_Cart:add_to_cart' product.id %}" method="post" style="margin-top: 20px;">
        {% csrf_token %}
        <button type="submit" class="btn" style="padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">Add to Cart</button>
    </form>
    
    <a href="{% url 'Product_Management:product_list' %}" style="display: inline-block; margin-top: 15px; color: #6c757d;">&larr; Back to Products</a>
</div>
{% endblock %}
